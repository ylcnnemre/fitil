# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Fitil is GPL-3.0, so every dependency must use a GPL-3.0-compatible license.

[advisories]
# Fail on known vulnerabilities; only flag unmaintained crates we depend on directly.
unmaintained = "workspace"
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # Permissive data license of the Mozilla root certificate list used for HTTPS.
    "CDLA-Permissive-2.0",
    "GPL-3.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Fitil's own crates are not published to crates.io.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Fitil's own crates refer to each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
