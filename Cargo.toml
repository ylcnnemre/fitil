[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/ylcnnemre/fitil"
publish = false

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
fitil-binance = { path = "crates/fitil-binance" }
fitil-chart = { path = "crates/fitil-chart" }
fitil-core = { path = "crates/fitil-core" }
fitil-exchange = { path = "crates/fitil-exchange" }
fitil-market = { path = "crates/fitil-market" }
fitil-store = { path = "crates/fitil-store" }
fluent-bundle = "0.16"
futures = "0.3"
iced = { version = "0.14", features = ["canvas", "tokio"] }
# rustls with `ring` as the crypto provider; the default aws-lc provider is avoided for licensing.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
unic-langid = "0.9"
